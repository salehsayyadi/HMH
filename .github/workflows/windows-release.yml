name: Build Windows Application & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Recreate Windows C++ Scaffolding
        working-directory: source/windows_app
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --project-name=hmh_windows_app .
          # Copy custom icon if available
          if (Test-Path assets/icons/app_icon.ico) {
            Copy-Item -Path assets/icons/app_icon.ico -Destination windows/runner/resources/app_icon.ico -Force
          }
          # Copy custom centered square window configuration
          if (Test-Path windows_custom/main.cpp) {
            Copy-Item -Path windows_custom/main.cpp -Destination windows/runner/main.cpp -Force
          }

      - name: Install dependencies
        working-directory: source/windows_app
        run: flutter pub get

      - name: Build Windows Executable (Release)
        working-directory: source/windows_app
        run: flutter build windows --release

      - name: Prepare Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "app/Windows/Portable" -Force
          Copy-Item -Path "source/windows_app/build/windows/x64/runner/Release/*" -Destination "app/Windows/Portable/" -Recurse -Force
          Compress-Archive -Path "app/Windows/Portable/*" -DestinationPath "IMH-Portable-x64.zip" -Force
          Copy-Item -Path "IMH-Portable-x64.zip" -Destination "HMH-Portable-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "app/Windows/Setup" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" source/deployment/scripts/HMH-Setup.iss
          if (Test-Path app/Windows/Setup/IMH-Setup-x64.exe) {
            Copy-Item -Path app/Windows/Setup/IMH-Setup-x64.exe -Destination app/Windows/Setup/HMH-Setup-x64.exe -Force
          }

      - name: Prepare Server & Web ZIPs
        shell: pwsh
        run: |
          Compress-Archive -Path "app/Admin-Web/*" -DestinationPath "IMH-Admin-Web.zip" -Force
          Compress-Archive -Path "app/Server-Deployment/*" -DestinationPath "IMH-Server-Deployment.zip" -Force
          Copy-Item "IMH-Admin-Web.zip" "HMH-Admin-Web.zip" -Force
          Copy-Item "IMH-Server-Deployment.zip" "HMH-Server-Deployment.zip" -Force

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IMH — Imam Hossein Schools Reservation System ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/Windows/Setup/IMH-Setup-x64.exe
            app/Windows/Setup/HMH-Setup-x64.exe
            IMH-Portable-x64.zip
            HMH-Portable-x64.zip
            IMH-Admin-Web.zip
            IMH-Server-Deployment.zip
          body: |
            ## سامانه متمرکز رزرواسیون سالن آمفی‌تئاتر مدارس امام حسین (ع) یزد (IMH) — نسخه ${{ github.ref_name }}

            ### محتویات بسته انتشار:
            1. **IMH-Setup-x64.exe**: فایل نصبی تحت ویندوز ۱۰ و ۱۱ برای رایانه مدارس
            2. **IMH-Portable-x64.zip**: نسخه پرتابل (بدون نیاز به نصب) برای اجرای مستقیم
            3. **IMH-Admin-Web.zip**: بیلد نهایی پنل وب مدیریت ارشد (React + TypeScript)
            4. **IMH-Server-Deployment.zip**: پکیج کامل استقرار سرور لینوکس (Docker Compose + MySQL 9.7 LTS + Nginx)

            ---
            **طراحی و توسعه‌یافته با افتخار توسط دانش‌آموز: محمد صالح صیادی (پایه یازدهم فنی) — سال تحصیلی ۱۴۰۵-۱۴۰۶**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
