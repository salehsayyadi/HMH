name: Build Applications & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: source/windows_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: source/windows_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare APK Output
        run: |
          mkdir -p release-android
          cp source/windows_app/build/app/outputs/flutter-apk/app-release.apk release-android/IMH-Android-v1.1.0.apk
          cp source/windows_app/build/app/outputs/flutter-apk/app-release.apk release-android/IMH-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-android/*

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Recreate Windows C++ Scaffolding
        working-directory: source/windows_app
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --project-name=hmh_windows_app .
          if (Test-Path assets/icons/app_icon.ico) {
            Copy-Item -Path assets/icons/app_icon.ico -Destination windows/runner/resources/app_icon.ico -Force
          }
          if (Test-Path windows_custom/main.cpp) {
            Copy-Item -Path windows_custom/main.cpp -Destination windows/runner/main.cpp -Force
          }

      - name: Install dependencies
        working-directory: source/windows_app
        run: flutter pub get

      - name: Build Windows Executable (Release)
        working-directory: source/windows_app
        run: flutter build windows --release

      - name: Prepare Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "app/Windows/Portable" -Force
          Copy-Item -Path "source/windows_app/build/windows/x64/runner/Release/*" -Destination "app/Windows/Portable/" -Recurse -Force
          Compress-Archive -Path "app/Windows/Portable/*" -DestinationPath "IMH-Portable-x64.zip" -Force
          Copy-Item "IMH-Portable-x64.zip" "HMH-Portable-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "app/Windows/Setup" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" source/deployment/scripts/HMH-Setup.iss
          if (Test-Path app/Windows/Setup/IMH-Setup-x64.exe) {
            Copy-Item -Path app/Windows/Setup/IMH-Setup-x64.exe -Destination app/Windows/Setup/HMH-Setup-x64.exe -Force
          }

      - name: Prepare Server & Web ZIPs
        shell: pwsh
        run: |
          Compress-Archive -Path "app/Admin-Web/*" -DestinationPath "IMH-Admin-Web.zip" -Force
          Compress-Archive -Path "app/Server-Deployment/*" -DestinationPath "IMH-Server-Deployment.zip" -Force
          Copy-Item "IMH-Admin-Web.zip" "HMH-Admin-Web.zip" -Force
          Copy-Item "IMH-Server-Deployment.zip" "HMH-Server-Deployment.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            app/Windows/Setup/IMH-Setup-x64.exe
            app/Windows/Setup/HMH-Setup-x64.exe
            IMH-Portable-x64.zip
            HMH-Portable-x64.zip
            IMH-Admin-Web.zip
            IMH-Server-Deployment.zip

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IMH — Imam Hossein Schools Reservation System ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-files/*
          body: |
            ## سامانه متمرکز رزرواسیون سالن آمفی‌تئاتر مدارس امام حسین (ع) یزد (IMH) — نسخه ${{ github.ref_name }}

            ### محتویات بسته انتشار:
            1. **IMH-Android-v1.1.0.apk**: اپلیکیشن رسمی اندروید سامانه برای گوشی‌های هوشمند کاربران و مدیران
            2. **IMH-Setup-x64.exe**: فایل نصبی تحت ویندوز ۱۰ و ۱۱ برای رایانه مدارس
            3. **IMH-Portable-x64.zip**: نسخه پرتابل (بدون نیاز به نصب) برای اجرای مستقیم روی رایانه‌ها
            4. **IMH-Admin-Web.zip**: بیلد نهایی پنل وب مدیریت ارشد (React + TypeScript)
            5. **IMH-Server-Deployment.zip**: پکیج کامل استقرار سرور لینوکس (Docker Compose + MySQL 9.7 LTS + Nginx)

            ---
            **طراحی و توسعه‌یافته توسط دانش‌آموز: محمد صالح صیادی (پایه یازدهم فنی)**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
